<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Expert Parallel and Expert Data Parallel groups</title><desc id="desc">GPUs 0–3 form one EP group; GPUs 4–7 form another. GPU pairs 0/4, 1/5, 2/6 and 3/7 hold matching expert shards and synchronize their expert gradients.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="20" y="35" font-size="27" fill="#243047" font-weight="600" text-anchor="start">Shard across a group. Replicate across groups.</text><text x="20" y="65" font-size="18" fill="#657086" font-weight="400" text-anchor="start">8 GPUs · 8 experts · 2 experts per GPU</text><rect x="15" y="96" width="970" height="112" rx="12" fill="#fafbfe" stroke="#dee3ec"/><text x="34" y="135" font-size="20" fill="#243047" font-weight="600" text-anchor="start">EP group 0</text><text x="34" y="166" font-size="16" fill="#657086" font-weight="400" text-anchor="start">dispatch / combine</text><rect x="236" y="120" width="155" height="65" rx="10" fill="#edf7f7" stroke="#167d87"/><text x="313.5" y="150.5" font-size="18" fill="#167d87" font-weight="600" text-anchor="middle">GPU 0</text><text x="313.5" y="173.5" font-size="16" fill="#167d87" font-weight="400" text-anchor="middle">experts e₀, e₁</text><rect x="417" y="120" width="155" height="65" rx="10" fill="#fcf1ed" stroke="#b65846"/><text x="494.5" y="150.5" font-size="18" fill="#b65846" font-weight="600" text-anchor="middle">GPU 1</text><text x="494.5" y="173.5" font-size="16" fill="#b65846" font-weight="400" text-anchor="middle">experts e₂, e₃</text><rect x="598" y="120" width="155" height="65" rx="10" fill="#f4eff9" stroke="#7954a1"/><text x="675.5" y="150.5" font-size="18" fill="#7954a1" font-weight="600" text-anchor="middle">GPU 2</text><text x="675.5" y="173.5" font-size="16" fill="#7954a1" font-weight="400" text-anchor="middle">experts e₄, e₅</text><rect x="779" y="120" width="155" height="65" rx="10" fill="#faf4e8" stroke="#a0711f"/><text x="856.5" y="150.5" font-size="18" fill="#a0711f" font-weight="600" text-anchor="middle">GPU 3</text><text x="856.5" y="173.5" font-size="16" fill="#a0711f" font-weight="400" text-anchor="middle">experts e₆, e₇</text><rect x="15" y="247" width="970" height="112" rx="12" fill="#fafbfe" stroke="#dee3ec"/><text x="34" y="286" font-size="20" fill="#243047" font-weight="600" text-anchor="start">EP group 1</text><text x="34" y="317" font-size="16" fill="#657086" font-weight="400" text-anchor="start">dispatch / combine</text><rect x="236" y="271" width="155" height="65" rx="10" fill="#edf7f7" stroke="#167d87"/><text x="313.5" y="301.5" font-size="18" fill="#167d87" font-weight="600" text-anchor="middle">GPU 4</text><text x="313.5" y="324.5" font-size="16" fill="#167d87" font-weight="400" text-anchor="middle">experts e₀, e₁</text><rect x="417" y="271" width="155" height="65" rx="10" fill="#fcf1ed" stroke="#b65846"/><text x="494.5" y="301.5" font-size="18" fill="#b65846" font-weight="600" text-anchor="middle">GPU 5</text><text x="494.5" y="324.5" font-size="16" fill="#b65846" font-weight="400" text-anchor="middle">experts e₂, e₃</text><rect x="598" y="271" width="155" height="65" rx="10" fill="#f4eff9" stroke="#7954a1"/><text x="675.5" y="301.5" font-size="18" fill="#7954a1" font-weight="600" text-anchor="middle">GPU 6</text><text x="675.5" y="324.5" font-size="16" fill="#7954a1" font-weight="400" text-anchor="middle">experts e₄, e₅</text><rect x="779" y="271" width="155" height="65" rx="10" fill="#faf4e8" stroke="#a0711f"/><text x="856.5" y="301.5" font-size="18" fill="#a0711f" font-weight="600" text-anchor="middle">GPU 7</text><text x="856.5" y="324.5" font-size="16" fill="#a0711f" font-weight="400" text-anchor="middle">experts e₆, e₇</text><path d="M313 185V271" fill="none" stroke="#167d87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M494 185V271" fill="none" stroke="#b65846" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M675 185V271" fill="none" stroke="#7954a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M856 185V271" fill="none" stroke="#a0711f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="35" y="411" font-size="19" fill="#657086" font-weight="400" text-anchor="start">Expert Data Parallel: synchronize gradients between replicas of the same shard.</text><text x="35" y="452" font-size="19" fill="#657086" font-weight="400" text-anchor="start">An EP group exchanges activations; each GPU keeps its expert weights local.</text></g></svg>