<svg xmlns="http://www.w3.org/2000/svg" width="430" height="690" viewBox="0 0 430 690" role="img" aria-labelledby="title desc">
<title id="title">Expert Parallel and Expert Data Parallel groups</title><desc id="desc">GPUs 0–3 form one EP group; GPUs 4–7 form another. GPU pairs 0/4, 1/5, 2/6 and 3/7 hold matching expert shards and synchronize their expert gradients.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="20" y="35" font-size="19" fill="#243047" font-weight="600" text-anchor="start">Shard experts. Replicate the shards.</text><text x="20" y="65" font-size="16" fill="#657086" font-weight="400" text-anchor="start">8 GPUs · 8 experts · 2 experts per GPU</text><rect x="14" y="88" width="170" height="440" rx="12" fill="#fafbfe" stroke="#dee3ec"/><text x="99" y="117" font-size="20" fill="#243047" font-weight="600" text-anchor="middle">EP group 0</text><rect x="26" y="143" width="146" height="63" rx="10" fill="#edf7f7" stroke="#167d87"/><text x="99.0" y="172.5" font-size="18" fill="#167d87" font-weight="600" text-anchor="middle">GPU 0</text><text x="99.0" y="195.5" font-size="16" fill="#167d87" font-weight="400" text-anchor="middle">e₀  ·  e₁</text><rect x="26" y="236" width="146" height="63" rx="10" fill="#fcf1ed" stroke="#b65846"/><text x="99.0" y="265.5" font-size="18" fill="#b65846" font-weight="600" text-anchor="middle">GPU 1</text><text x="99.0" y="288.5" font-size="16" fill="#b65846" font-weight="400" text-anchor="middle">e₂  ·  e₃</text><rect x="26" y="329" width="146" height="63" rx="10" fill="#f4eff9" stroke="#7954a1"/><text x="99.0" y="358.5" font-size="18" fill="#7954a1" font-weight="600" text-anchor="middle">GPU 2</text><text x="99.0" y="381.5" font-size="16" fill="#7954a1" font-weight="400" text-anchor="middle">e₄  ·  e₅</text><rect x="26" y="422" width="146" height="63" rx="10" fill="#faf4e8" stroke="#a0711f"/><text x="99.0" y="451.5" font-size="18" fill="#a0711f" font-weight="600" text-anchor="middle">GPU 3</text><text x="99.0" y="474.5" font-size="16" fill="#a0711f" font-weight="400" text-anchor="middle">e₆  ·  e₇</text><rect x="245" y="88" width="170" height="440" rx="12" fill="#fafbfe" stroke="#dee3ec"/><text x="330" y="117" font-size="20" fill="#243047" font-weight="600" text-anchor="middle">EP group 1</text><rect x="257" y="143" width="146" height="63" rx="10" fill="#edf7f7" stroke="#167d87"/><text x="330.0" y="172.5" font-size="18" fill="#167d87" font-weight="600" text-anchor="middle">GPU 4</text><text x="330.0" y="195.5" font-size="16" fill="#167d87" font-weight="400" text-anchor="middle">e₀  ·  e₁</text><rect x="257" y="236" width="146" height="63" rx="10" fill="#fcf1ed" stroke="#b65846"/><text x="330.0" y="265.5" font-size="18" fill="#b65846" font-weight="600" text-anchor="middle">GPU 5</text><text x="330.0" y="288.5" font-size="16" fill="#b65846" font-weight="400" text-anchor="middle">e₂  ·  e₃</text><rect x="257" y="329" width="146" height="63" rx="10" fill="#f4eff9" stroke="#7954a1"/><text x="330.0" y="358.5" font-size="18" fill="#7954a1" font-weight="600" text-anchor="middle">GPU 6</text><text x="330.0" y="381.5" font-size="16" fill="#7954a1" font-weight="400" text-anchor="middle">e₄  ·  e₅</text><rect x="257" y="422" width="146" height="63" rx="10" fill="#faf4e8" stroke="#a0711f"/><text x="330.0" y="451.5" font-size="18" fill="#a0711f" font-weight="600" text-anchor="middle">GPU 7</text><text x="330.0" y="474.5" font-size="16" fill="#a0711f" font-weight="400" text-anchor="middle">e₆  ·  e₇</text><path d="M184 174H245" fill="none" stroke="#167d87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M184 267H245" fill="none" stroke="#b65846" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M184 360H245" fill="none" stroke="#7954a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M184 453H245" fill="none" stroke="#a0711f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="215" y="554" font-size="19" fill="#243047" font-weight="600" text-anchor="middle">Each column: dispatch / combine</text><text x="215" y="583" font-size="18" fill="#657086" font-weight="400" text-anchor="middle">within one EP group.</text><text x="215" y="625" font-size="17" fill="#657086" font-weight="400" text-anchor="middle">Expert-DP: synchronize gradients</text><text x="215" y="651" font-size="17" fill="#657086" font-weight="400" text-anchor="middle">between matching expert replicas.</text></g></svg>