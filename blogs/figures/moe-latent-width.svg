<svg xmlns="http://www.w3.org/2000/svg" width="980" height="622" viewBox="0 0 980 622" role="img" aria-labelledby="title desc">
<title id="title">Standard MoE and LatentMoE</title><desc id="desc">LatentMoE adds shared down/up projections around the routed branch. The router and shared experts read the original d-dimensional token. Only routed expert inputs and outputs use latent width ℓ; d_f is the intermediate width.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="1" y="1" width="478" height="620" rx="12" fill="#fafbfe" stroke="#edf0f5"/><text x="22" y="39" font-size="26" fill="#243047" font-weight="600" text-anchor="start">Standard MoE</text><text x="22" y="68" font-size="18" fill="#657086" font-weight="400" text-anchor="start">Routed experts use the model width.</text><rect x="157" y="90" width="96" height="43" rx="10" fill="white" stroke="#243047"/><text x="205.0" y="117.5" font-size="18" fill="#243047" font-weight="600" text-anchor="middle">x  [d]</text><path d="M157 111H65V157" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="16" y="157" width="98" height="51" rx="10" fill="#faf4e8" stroke="#a0711f"/><text x="65.0" y="188.5" font-size="18" fill="#a0711f" font-weight="600" text-anchor="middle">Router</text><path d="M65 208V252H137" fill="none" stroke="#a0711f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="23" y="283" font-size="17" fill="#a0711f" font-weight="400" text-anchor="start">top-k</text><path d="M253 111H392V295" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="326" y="295" width="132" height="62" rx="10" fill="white" stroke="#243047"/><text x="392.0" y="324.0" font-size="16" fill="#243047" font-weight="600" text-anchor="middle">Shared expert</text><text x="392.0" y="347.0" font-size="16" fill="#243047" font-weight="400" text-anchor="middle">d → d</text><path d="M392 357V493H221" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M205 133V225" fill="none" stroke="#167d87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="221" y="183" font-size="17" fill="#167d87" font-weight="400" text-anchor="start">d values</text><rect x="137" y="225" width="137" height="75" rx="10" fill="#edf7f7" stroke="#167d87"/><text x="205.5" y="260.5" font-size="17" fill="#167d87" font-weight="600" text-anchor="middle">Routed experts</text><text x="205.5" y="283.5" font-size="16" fill="#167d87" font-weight="400" text-anchor="middle">d → d_f → d</text><path d="M205 300V325" fill="none" stroke="#167d87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="137" y="325" width="137" height="57" rx="10" fill="#edf7f7" stroke="#167d87"/><text x="205.5" y="351.5" font-size="17" fill="#167d87" font-weight="600" text-anchor="middle">Weighted sum</text><text x="205.5" y="374.5" font-size="16" fill="#167d87" font-weight="400" text-anchor="middle">in width d</text><path d="M205 382V477" fill="none" stroke="#167d87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="221" y="433" font-size="17" fill="#167d87" font-weight="400" text-anchor="start">d values</text><circle cx="205" cy="493" r="16" fill="white" stroke="#243047"/><text x="205" y="500" font-size="25" fill="#243047" font-weight="400" text-anchor="middle">+</text><path d="M205 509V532" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="157" y="532" width="96" height="43" rx="10" fill="white" stroke="#243047"/><text x="205.0" y="559.5" font-size="18" fill="#243047" font-weight="600" text-anchor="middle">y  [d]</text><text x="240" y="605" font-size="19" fill="#167d87" font-weight="600" text-anchor="middle">Each routed input / output: d values</text><g transform="translate(500,0)"><rect x="1" y="1" width="478" height="620" rx="12" fill="#fafbfe" stroke="#edf0f5"/><text x="22" y="39" font-size="26" fill="#243047" font-weight="600" text-anchor="start">LatentMoE</text><text x="22" y="68" font-size="18" fill="#657086" font-weight="400" text-anchor="start">Compress only the routed branch.</text><rect x="157" y="90" width="96" height="43" rx="10" fill="white" stroke="#243047"/><text x="205.0" y="117.5" font-size="18" fill="#243047" font-weight="600" text-anchor="middle">x  [d]</text><path d="M157 111H65V157" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="16" y="157" width="98" height="51" rx="10" fill="#faf4e8" stroke="#a0711f"/><text x="65.0" y="188.5" font-size="18" fill="#a0711f" font-weight="600" text-anchor="middle">Router</text><path d="M65 208V252H137" fill="none" stroke="#a0711f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="23" y="283" font-size="17" fill="#a0711f" font-weight="400" text-anchor="start">top-k</text><path d="M253 111H392V295" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="326" y="295" width="132" height="62" rx="10" fill="white" stroke="#243047"/><text x="392.0" y="324.0" font-size="16" fill="#243047" font-weight="600" text-anchor="middle">Shared expert</text><text x="392.0" y="347.0" font-size="16" fill="#243047" font-weight="400" text-anchor="middle">d → d</text><path d="M392 357V493H221" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M205 133V151" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="140" y="151" width="130" height="47" rx="10" fill="#f4eff9" stroke="#7954a1"/><text x="205.0" y="180.5" font-size="18" fill="#7954a1" font-weight="600" text-anchor="middle">W↓  d → ℓ</text><path d="M205 198V225" fill="none" stroke="#7954a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="137" y="225" width="137" height="75" rx="10" fill="#f4eff9" stroke="#7954a1"/><text x="205.5" y="260.5" font-size="17" fill="#7954a1" font-weight="600" text-anchor="middle">Routed experts</text><text x="205.5" y="283.5" font-size="16" fill="#7954a1" font-weight="400" text-anchor="middle">ℓ → d_f → ℓ</text><path d="M205 300V325" fill="none" stroke="#7954a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="137" y="325" width="137" height="57" rx="10" fill="#f4eff9" stroke="#7954a1"/><text x="205.5" y="351.5" font-size="17" fill="#7954a1" font-weight="600" text-anchor="middle">Weighted sum</text><text x="205.5" y="374.5" font-size="16" fill="#7954a1" font-weight="400" text-anchor="middle">in width ℓ</text><path d="M205 382V407" fill="none" stroke="#7954a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="140" y="407" width="130" height="47" rx="10" fill="#f4eff9" stroke="#7954a1"/><text x="205.0" y="436.5" font-size="18" fill="#7954a1" font-weight="600" text-anchor="middle">W↑  ℓ → d</text><path d="M205 454V477" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="205" cy="493" r="16" fill="white" stroke="#243047"/><text x="205" y="500" font-size="25" fill="#243047" font-weight="400" text-anchor="middle">+</text><path d="M205 509V532" fill="none" stroke="#657086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="157" y="532" width="96" height="43" rx="10" fill="white" stroke="#243047"/><text x="205.0" y="559.5" font-size="18" fill="#243047" font-weight="600" text-anchor="middle">y  [d]</text><text x="240" y="605" font-size="19" fill="#7954a1" font-weight="600" text-anchor="middle">Each routed input / output: ℓ values</text></g></g></svg>